<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background: rgba(20, 20, 30, 0.15);
    }
    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: #1a1d24;
      color: #eef0f4;
      font: 13px -apple-system, "Segoe UI", Roboto, sans-serif;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div class="hint">Кликни туда, где должен кликать автокликер. Esc — отмена.</div>
  <script>
    document.addEventListener("click", (e) => {
      const offsetX = window.__offsetX || 0;
      const offsetY = window.__offsetY || 0;
      window.pickApi.reportClick({ x: e.clientX + offsetX, y: e.clientY + offsetY });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") window.close();
    });
  </script>
</body>
</html>
