<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Разбор матча — Clash Royale</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #14161c;
      color: #e6e8ef;
    }
    header {
      position: sticky;
      top: 0;
      background: #1c1f26;
      border-bottom: 1px solid #21242c;
      padding: 14px 18px;
      z-index: 5;
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }
    header p {
      margin: 0;
      font-size: 12.5px;
      color: #9aa0b0;
      line-height: 1.5;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: #9aa0b0;
      padding: 6px 4px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 0;
    }
    .tab-btn.active {
      color: #e6e8ef;
      border-bottom-color: #3a7bd5;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    button {
      background: #262a34;
      color: #e6e8ef;
      border: 1px solid #333846;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #2f3440; }
    .page { padding: 16px; }
    .page[hidden] { display: none; }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .item {
      background: #1c1f26;
      border: 1px solid #21242c;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      background: #0e1015;
      border-radius: 6px;
      image-rendering: pixelated;
      cursor: zoom-in;
    }
    .item .time {
      font-size: 11px;
      color: #6b7080;
    }
    .item-controls {
      display: flex;
      gap: 6px;
    }
    .item-controls input {
      flex: 1;
      background: #0e1015;
      border: 1px solid #21242c;
      border-radius: 6px;
      color: #e6e8ef;
      padding: 6px 8px;
      font-size: 13px;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #6b7080;
      padding: 40px 0;
      font-size: 14px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      cursor: zoom-out;
    }
    .modal-backdrop.open { display: flex; }
    .modal-backdrop img {
      max-width: 85vw;
      max-height: 85vh;
      image-rendering: pixelated;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .library-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .library-list {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .library-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1f26;
      border: 1px solid #21242c;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .library-list-item:hover { background: #22262f; }
    .library-list-item.active { border-color: #3a7bd5; background: #1c2733; }
    .library-list-item .count {
      color: #6b7080;
      font-size: 12px;
    }
    .library-samples {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }
    .sample-card {
      background: #1c1f26;
      border: 1px solid #21242c;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .sample-card img {
      width: 100%;
      height: 90px;
      object-fit: contain;
      background: #0e1015;
      border-radius: 4px;
      image-rendering: pixelated;
      cursor: zoom-in;
    }
    .sample-card button {
      font-size: 11px;
      padding: 4px 6px;
      color: #f87171;
    }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Clash Royale</h1>
    <p id="headerHint">То, что распознавание не смогло уверенно опознать вживую, попадает сюда. Не
      спеша разбери: что здесь было? Если персонажей на кропе несколько — впиши через запятую.
      Клик по картинке открывает её крупнее.</p>
    <div class="tabs">
      <button class="tab-btn active" id="tabReview">Разбор матча</button>
      <button class="tab-btn" id="tabLibrary">База образцов</button>
    </div>
    <div class="toolbar" id="reviewToolbar">
      <button id="refreshBtn">Обновить список</button>
      <button id="clearBtn">Очистить всё</button>
    </div>
  </header>

  <div class="page" id="pageReview">
    <main id="list"></main>
  </div>

  <div class="page" id="pageLibrary" hidden>
    <div class="library-layout">
      <div class="library-list" id="libraryList"></div>
      <div class="library-samples" id="librarySamples"></div>
    </div>
  </div>

  <datalist id="cardDatalist"></datalist>
  <div class="modal-backdrop" id="modalBackdrop">
    <img id="modalImg" src="" alt="" />
  </div>
  <script>
    let cardsList = [];
    let cardsById = {};
    let selectedLibraryCard = null;

    function escapeHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function findCardsByNames(text) {
      return text
        .split(",")
        .map((s) => s.trim().toLowerCase())
        .filter(Boolean)
        .map((name) => cardsList.find((c) => c.name.toLowerCase() === name))
        .filter(Boolean);
    }

    async function loadCards() {
      cardsList = await window.clashReviewApi.getCards();
      cardsById = {};
      cardsList.forEach((c) => (cardsById[c.id] = c));
      document.getElementById("cardDatalist").innerHTML = cardsList
        .map((c) => `<option value="${escapeHtml(c.name)}"></option>`)
        .join("");
    }

    // --- Вкладка "Разбор матча" ---

    async function loadList() {
      const items = await window.clashReviewApi.getPendingReview();
      renderList(items);
    }

    function renderList(items) {
      const list = document.getElementById("list");
      if (!items.length) {
        list.innerHTML = `<div class="empty">Пока нечего разбирать — либо ничего не происходило, либо всё распозналось само.</div>`;
        return;
      }
      list.innerHTML = items
        .map(
          (item) => `
        <div class="item" data-id="${item.id}">
          <img src="${item.dataUrl}" class="preview" />
          <div class="time">${new Date(item.at).toLocaleTimeString()}</div>
          <div class="item-controls">
            <input type="text" list="cardDatalist" placeholder="Карта(ы) через запятую..." />
            <button class="save-btn">Сохранить</button>
            <button class="skip-btn">Пропустить</button>
          </div>
        </div>`
        )
        .join("");
      list.querySelectorAll(".item").forEach((el) => {
        const id = Number(el.dataset.id);
        const input = el.querySelector("input");
        const img = el.querySelector("img");
        img.addEventListener("click", () => openModal(img.src));
        el.querySelector(".save-btn").addEventListener("click", async () => {
          const found = findCardsByNames(input.value);
          if (!found.length) return;
          await window.clashReviewApi.resolvePendingReview(id, found.map((c) => c.id));
          loadList();
        });
        el.querySelector(".skip-btn").addEventListener("click", async () => {
          await window.clashReviewApi.resolvePendingReview(id, null);
          loadList();
        });
      });
    }

    function openModal(src) {
      document.getElementById("modalImg").src = src;
      document.getElementById("modalBackdrop").classList.add("open");
    }
    document.getElementById("modalBackdrop").addEventListener("click", () => {
      document.getElementById("modalBackdrop").classList.remove("open");
    });

    document.getElementById("refreshBtn").addEventListener("click", loadList);
    document.getElementById("clearBtn").addEventListener("click", async () => {
      await window.clashReviewApi.clearPendingReview();
      loadList();
    });

    window.clashReviewApi.onPendingReviewCount(() => {
      if (!document.getElementById("pageLibrary").hidden) return; // не мешаем разбирать библиотеку
      loadList();
    });

    // --- Вкладка "База образцов" ---
    // Показывает, чему база реально научилась — если распознавание ошибочно засчитало что-то не
    // то (или сам случайно указал не ту карту), здесь можно найти конкретный кадр и удалить его.

    async function loadLibraryList() {
      const counts = await window.clashReviewApi.getCardSampleCounts();
      const listEl = document.getElementById("libraryList");
      const ids = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      if (!ids.length) {
        listEl.innerHTML = `<div class="empty" style="padding:16px 0;">Пока нет ни одного настоящего образца — только заглушки.</div>`;
        document.getElementById("librarySamples").innerHTML = "";
        return;
      }
      listEl.innerHTML = ids
        .map((id) => {
          const card = cardsById[id];
          return `<div class="library-list-item${id === selectedLibraryCard ? " active" : ""}" data-id="${id}">
            <span>${escapeHtml(card ? card.name : id)}</span>
            <span class="count">${counts[id]}</span>
          </div>`;
        })
        .join("");
      listEl.querySelectorAll(".library-list-item").forEach((el) => {
        el.addEventListener("click", () => {
          selectedLibraryCard = el.dataset.id;
          loadLibraryList();
          loadLibrarySamples(selectedLibraryCard);
        });
      });
      if (selectedLibraryCard && !ids.includes(selectedLibraryCard)) {
        selectedLibraryCard = null;
        document.getElementById("librarySamples").innerHTML = "";
      }
    }

    async function loadLibrarySamples(cardId) {
      const samples = await window.clashReviewApi.getCardSamples(cardId);
      const el = document.getElementById("librarySamples");
      if (!samples.length) {
        el.innerHTML = `<div class="empty">Образцов не осталось.</div>`;
        return;
      }
      el.innerHTML = samples
        .map(
          (s) => `
        <div class="sample-card" data-file="${escapeHtml(s.file)}">
          <img src="${s.dataUrl}" />
          <button class="delete-sample-btn">Удалить (ошибка)</button>
        </div>`
        )
        .join("");
      el.querySelectorAll(".sample-card").forEach((card) => {
        card.querySelector("img").addEventListener("click", () => openModal(card.querySelector("img").src));
        card.querySelector(".delete-sample-btn").addEventListener("click", async () => {
          await window.clashReviewApi.deleteCardSample(cardId, card.dataset.file);
          loadLibraryList();
          loadLibrarySamples(cardId);
        });
      });
    }

    // --- Переключение вкладок ---

    function showTab(tab) {
      const isReview = tab === "review";
      document.getElementById("tabReview").classList.toggle("active", isReview);
      document.getElementById("tabLibrary").classList.toggle("active", !isReview);
      document.getElementById("pageReview").hidden = !isReview;
      document.getElementById("pageLibrary").hidden = isReview;
      document.getElementById("reviewToolbar").hidden = !isReview;
      document.getElementById("headerHint").textContent = isReview
        ? "То, что распознавание не смогло уверенно опознать вживую, попадает сюда. Не спеша разбери: что здесь было? Если персонажей на кропе несколько — впиши через запятую. Клик по картинке открывает её крупнее."
        : "Чему база реально научилась на каждую карту. Если вживую что-то распозналось неправильно (или сам ошибся при разборе) — найди образец здесь и удали его.";
      if (isReview) loadList();
      else loadLibraryList();
    }
    document.getElementById("tabReview").addEventListener("click", () => showTab("review"));
    document.getElementById("tabLibrary").addEventListener("click", () => showTab("library"));

    loadCards().then(loadList);
  </script>
</body>
</html>
