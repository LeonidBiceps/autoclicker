<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background: rgba(20, 20, 30, 0.15);
      overflow: hidden;
    }
    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: #1a1d24;
      color: #eef0f4;
      font: 13px -apple-system, "Segoe UI", Roboto, sans-serif;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    #box {
      position: fixed;
      display: none;
      border: 2px dashed #7fc4ff;
      background: rgba(127, 196, 255, 0.15);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hint">Выдели область с текстом (зажми и потяни). Esc — отмена.</div>
  <div id="box"></div>
  <script>
    const box = document.getElementById("box");
    let startX = null;
    let startY = null;

    function updateBox(curX, curY) {
      const x = Math.min(startX, curX);
      const y = Math.min(startY, curY);
      box.style.left = x + "px";
      box.style.top = y + "px";
      box.style.width = Math.abs(curX - startX) + "px";
      box.style.height = Math.abs(curY - startY) + "px";
    }

    document.addEventListener("mousedown", (e) => {
      startX = e.clientX;
      startY = e.clientY;
      box.style.display = "block";
      updateBox(e.clientX, e.clientY);
    });

    document.addEventListener("mousemove", (e) => {
      if (startX === null) return;
      updateBox(e.clientX, e.clientY);
    });

    document.addEventListener("mouseup", (e) => {
      if (startX === null) return;
      const offsetX = window.__offsetX || 0;
      const offsetY = window.__offsetY || 0;
      const x1 = Math.min(startX, e.clientX);
      const y1 = Math.min(startY, e.clientY);
      const width = Math.abs(e.clientX - startX);
      const height = Math.abs(e.clientY - startY);
      startX = null;
      startY = null;
      if (width < 4 || height < 4) {
        box.style.display = "none"; // слишком маленькое выделение — считаем случайным кликом, пробуем заново
        return;
      }
      window.pickApi.reportRegion({ x: Math.round(x1 + offsetX), y: Math.round(y1 + offsetY), width: Math.round(width), height: Math.round(height) });
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") window.close();
    });
  </script>
</body>
</html>
