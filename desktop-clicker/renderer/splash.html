<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #14161b;
      color: #eef0f4;
      font: 13px -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    img {
      width: 64px;
      height: 64px;
    }
    .name {
      font-size: 16px;
      font-weight: 700;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid #2a2e38;
      border-top-color: #2d6cdf;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hint {
      color: #6b7080;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="../icon.png" alt="" />
    <div class="name">МультиТул</div>
    <div class="spinner"></div>
    <div class="hint">Загрузка…</div>
  </div>
</body>
</html>
