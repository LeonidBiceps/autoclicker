<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .dot {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #2d6cdf;
      color: #fff;
      font: 700 11px -apple-system, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 0 0 2px rgba(45, 108, 223, 0.35);
    }
  </style>
</head>
<body>
  <div class="dot" id="n"></div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("n").textContent = params.get("n") || "";
  </script>
</body>
</html>
