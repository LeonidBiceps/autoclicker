<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .hud {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 12px;
      font: 600 13px -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #ff8a8a;
      background: rgba(20, 22, 28, 0.85);
      border-radius: 8px;
      white-space: nowrap;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff4d4d;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="hud"><span class="dot"></span><span id="t">REC</span></div>
</body>
</html>
