<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font: 11px -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #eef0f4;
    }
    .panel {
      background: rgba(18, 20, 26, 0.88);
      border-radius: 10px;
      padding: 8px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .top-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .elixir-bar {
      flex: 1;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 7px;
      overflow: hidden;
      position: relative;
    }
    .elixir-fill {
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #d946ef);
      width: 0%;
      transition: width 0.2s linear;
    }
    .elixir-num {
      font-weight: 700;
      font-size: 13px;
      min-width: 30px;
      text-align: right;
    }
    .phase-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .phase-badge.x2 { background: #b45309; }
    .phase-badge.x3 { background: #b91c1c; }
    .deck-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .slot {
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
      padding: 2px;
    }
    .slot.unknown {
      color: rgba(255, 255, 255, 0.3);
      font-size: 18px;
    }
    .slot.in-hand {
      background: rgba(34, 197, 94, 0.25);
      box-shadow: inset 0 0 0 1px rgba(34, 197, 94, 0.6);
    }
    .slot.in-queue {
      opacity: 0.55;
    }
    .slot img {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
    }
    .slot .name {
      font-size: 9px;
      line-height: 1.1;
      margin-top: 2px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="top-row">
      <div class="elixir-bar"><div class="elixir-fill" id="elixirFill"></div></div>
      <div class="elixir-num" id="elixirNum">0.0</div>
      <div class="phase-badge" id="phaseBadge">x1</div>
    </div>
    <div class="deck-grid" id="deckGrid"></div>
  </div>

  <script>
    let cardsById = {};
    const deckGrid = document.getElementById("deckGrid");

    function render(state) {
      document.getElementById("elixirFill").style.width = (state.elixir / 10) * 100 + "%";
      document.getElementById("elixirNum").textContent = state.elixir.toFixed(1);
      const badge = document.getElementById("phaseBadge");
      if (state.overtime) {
        badge.textContent = "x3 ОТ";
        badge.className = "phase-badge x3";
      } else if (state.phaseMultiplier >= 2) {
        badge.textContent = "x2";
        badge.className = "phase-badge x2";
      } else {
        badge.textContent = "x1";
        badge.className = "phase-badge";
      }

      const slots = [];
      for (let i = 0; i < 8; i++) {
        const id = state.revealedOrder[i];
        if (!id) {
          slots.push(`<div class="slot unknown">?</div>`);
          continue;
        }
        const card = cardsById[id];
        const cls = state.inHand.includes(id) ? "in-hand" : state.inQueue.includes(id) ? "in-queue" : "";
        slots.push(`<div class="slot ${cls}"><img src="${card ? card.iconUrl : ""}" onerror="this.style.display='none'"/><span class="name">${card ? card.name : id}</span></div>`);
      }
      deckGrid.innerHTML = slots.join("");
    }

    (async () => {
      const cards = await window.clashHudApi.getCards();
      cards.forEach((c) => (cardsById[c.id] = c));
      window.clashHudApi.onState((state) => render(state));
    })();
  </script>
</body>
</html>
