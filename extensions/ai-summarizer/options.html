<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки — ИИ-сокращатель</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #16181d;
      color: #eef0f4;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #9aa0ad;
      line-height: 1.5;
    }
    a {
      color: #6fa3ff;
    }
    label {
      display: block;
      font-size: 12px;
      color: #9aa0ad;
      margin: 16px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #2a2e38;
      background: #1e2128;
      color: #eef0f4;
    }
    button {
      margin-top: 14px;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      background: #2d6cdf;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    .status {
      font-size: 12px;
      margin-top: 10px;
      color: #6fe08a;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ИИ-сокращатель статей</h1>
    <p>
      Нужен собственный API-ключ Anthropic. Получить можно в
      <a href="https://console.anthropic.com/settings/keys" target="_blank">console.anthropic.com</a>.
      Ключ хранится только в этом браузере и никуда, кроме api.anthropic.com, не отправляется.
    </p>
    <label for="apiKey">API-ключ</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
    <button id="save">Сохранить</button>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
